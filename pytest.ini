[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show the reason for every skip. This suite skips deliberately and often (an account
# with no role, a read-only environment), and a silent "s" hides information the run
# is trying to give you.
addopts = -v -ra --strict-markers

# Suites. A test may carry SEVERAL - the same robust test belongs in smoke AND regression
# without being written twice. Run one with, e.g.:  pytest -m "sla or escalation"
markers =
    p0: QA/qa-priority-test-matrix.md P0 - breaks the product or leaks data if wrong; test every cycle
    p1: QA/qa-priority-test-matrix.md P1 - core feature; test every cycle time permitting
    p2: QA/qa-priority-test-matrix.md P2 - edge case / lower-traffic / known-incomplete; test when there is time
    smoke: the short confidence run - "is the application fundamentally working?"
    sanity: focused re-check of one changed area
    functional: a business rule, checked directly
    regression: protects existing P0/P1 behaviour
    integration: crosses a system boundary (email, webform, Data Mart)
    e2e: a whole business journey, several roles
    negative: the refusal case - the half that catches real defects
    rbac: role and permission behaviour
    data_isolation: one department/user must not see another's data
    sla: SLA calculation, indicator, breach
    escalation: the escalation chain
    audit: the compliance trail
    ai: AI-assisted business OUTPUT (never model internals)
    flow: the end-to-end lifecycle journeys
    verify: post-fix verification
    demo: the cut-down set used for demonstrations
    write: changes real data (creates a ticket, moves one, marks notifications read) - skipped unless writeTestsEnabled is true
    roles: signs in as several accounts in turn

# PHASE. Which delivery phase's behaviour a test covers, so the same framework serves both.
    phase1: Phase 1 behaviour (or platform-wide behaviour Phase 1 already relies on)
    phase2: Phase 2 behaviour

# EXECUTION STATE - a separate axis from suite membership and from priority. A test carries
# exactly one of these, or none (none = it runs and should be green).
#   The gating regression run is:  -m "regression and not blocked"
    blocked: valid coverage that CANNOT run here yet - argument names the blocker
             (roleless_account, tier1_window, shared_uat_no_drag -
             a Kanban drag that could write if the drop lands one column off; cc_supervisor
             was retired 2026-09-30 when supervisor-gen@awnic.com got the role). These
             already skip themselves with the reason; the marker is for selection/reporting
    quarantine: known defect or unexplained failure - argument names it (SETTINGS-500,
                FUNC_011/FUNC_045, unexplained-<date>). Must stay red and visible, never gate
    api_candidate: better asserted at the API layer (arithmetic, pagination, input handling).
                   Held here unchanged until that tier exists
    env_check: a statement about the ENVIRONMENT or test data, not about the product

# No test may run longer than 5 minutes - a stuck test is stopped instead of hanging the
# whole run. This setting comes from the pytest-timeout package (in requirements.txt).
timeout = 300

# Stop straight away with a clear message if pytest-timeout is missing. Without it the
# timeout above is silently ignored (pytest only prints "Unknown config option: timeout").
# This happens when you run a pytest that is not this project's .venv - activate it first:
#   source .venv/bin/activate
required_plugins = pytest-timeout>=2.3
