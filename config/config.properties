# ---------------------------------------------------------------------------
# LOCAL settings - used when you run plain `pytest` (no --env).
# For the shared UAT site use `pytest --env=deployed` (config.deployed.properties).
#
# Start the app first:
#   apps/api  ->  uvicorn app.main:app --port 8010
#   apps/web  ->  npm run dev   (port 3200)
# If the web app runs on another port: pytest -D baseUrl=http://localhost:<port>
# ---------------------------------------------------------------------------

baseUrl = http://localhost:3200

# The local dev server compiles each page on its first visit, which can take close to a
# minute, so the wait is longer than on UAT (20). Once the app is warm you can pass
# -D timeoutSeconds=20 to make failures show up faster.
timeoutSeconds = 60

headless = false


# ---------------------------------------------------------------------------
# Test accounts - one per role.
#
# Checked on 2026-10-01 against the user/role list (user_roles export, 185 role grants)
# joined to the user and role tables. Every account below is active, holds exactly one
# role, and has signed in before. Sign-in needs only the email (dev login), so there is
# no password in this file.
#
# The local API uses the same database as UAT (apps/api/.env DATABASE_URL), so these are
# the same accounts as config.deployed.properties.
# ---------------------------------------------------------------------------

# admin - the only other admin (it_helpdesk@awnic.com) has never signed in.
adminEmail = admin@awnic.ae

# cc_initiator - 23 active initiators; this one already holds tickets.
ccInitiatorEmail = a_hassouna@awnic.com

# head_of_department - Broker & Motor Underwriting (that department has tickets).
hodEmail = v_mertia@awnic.com

# manager - Business Support (that department has tickets).
managerEmail = c_chiong@awnic.com

# cc_supervisor - the only holder of this role (team: General Inquiry).
supervisorEmail = supervisor-gen@awnic.com

# complaint_handler - the only holder of this role (team: Complaints).
# No complaint is assigned to it right now, so its "own complaints" tests skip.
complaintHandlerEmail = complaints.officer@awnic.ae

# compliance_officer - NOBODY holds this role. Kept as a placeholder so the tests start
# running as soon as the account is created; until then they skip (see below).
complianceEmail = compliance@awnic.ae

# dept_poc - Medical Operations. deptPocDepartment below must match this account's department.
deptPocEmail = a_shalaby@awnic.com

# An address with no account, for the "unknown email is rejected" test.
unknownEmail = not.a.real.user@awnic.ae


# ---------------------------------------------------------------------------
# How the suite behaves
# ---------------------------------------------------------------------------

# true = a test whose account does not exist SKIPS with a reason instead of failing.
# true here because the local API shares the UAT user list, where compliance@awnic.ae
# does not exist.
missingAccountsAreSkipped = true

# Tests that create or change real data. Keep false - the local API writes to the shared
# UAT database.
writeTestsEnabled = false


# ---------------------------------------------------------------------------
# Data the tests rely on
# ---------------------------------------------------------------------------

# The department of deptPocEmail (used by the department-isolation tests).
deptPocDepartment = Medical Operations
complaintHandlerTicketTail = 0001
