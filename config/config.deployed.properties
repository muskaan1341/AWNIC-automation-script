# ---------------------------------------------------------------------------
# The SHARED AWS test site (App Runner).
#
# Use it with:   mvn clean test -Denv=deployed
#
# READ THIS BEFORE YOU RUN ANYTHING HERE.
# This environment is shared with the whole team. Other people are testing on it
# at the same time, and the email-intake testing (testaiagent@awnic.com) is
# creating real tickets on it. So:
#   * every count in a test is a moving target - tests here assert relationships
#     ("open can never exceed total"), never fixed numbers,
#   * the three tests that CREATE a ticket are switched OFF by default below.
#     Turn them on deliberately with -DwriteTestsEnabled=true when you actually
#     want to exercise the create flow end to end,
#   * do not point a destructive test at this file.
# ---------------------------------------------------------------------------

baseUrl = https://twu3nrmnmv.eu-west-1.awsapprunner.com

# The API behind it, for the health check:
#   https://ttg9m2zhsm.eu-west-1.awsapprunner.com/health  ->  {"status":"ok"}

# This is a real deployment, not a development server, so pages are already built
# and render in about a second. No 40-second first-visit compile to wait for.
timeoutSeconds = 20

headless = false


# ---------------------------------------------------------------------------
# Test accounts.
#
# SIGNING IN IS NOT THE SAME THING AS BEING ABLE TO SEE ANYTHING.
#
# An earlier note here said "seven of the eight work", because seven of them could sign
# in. That was the wrong test. Signing in only proves the row exists in `user`; what
# decides whether any screen renders is a row in `user_roles`, and five of these accounts
# had none. Judge an account by the role it holds, not by whether the login succeeds.
#
# Dev login takes an email and no password, so there is no secret in this file.
# ---------------------------------------------------------------------------

# Documented in the handover note. admin and agent are the two that carry a real role.
# NO ACCOUNT HOLDS `admin` AFTER THE 2026-09-09 DATABASE CLEAN. Left pointing at the
# deleted seed account on purpose: sign-in fails with the API's own "No matching
# account" sentence, which missingAccountsAreSkipped turns into a SKIP naming the
# account - far clearer than silently dropping the admin tests.
adminEmail = admin@awnic.ae
# cc_initiator, and the ONLY one that has signed in - so it is the only account that
# can create a ticket without also flipping somebody's Admin Portal status.
agentEmail = a_hassouna@awnic.com

# PICK THE ACCOUNT BY ITS ROLE, NOT BY THE SHAPE OF ITS ADDRESS.
#
# The five "<role>@awnic.ae" placeholders below all EXIST and can all sign in - but on
# 2026-09-04 five of them had no row in `user_roles` at all, so they signed in and were
# then refused every screen. That produced roughly twenty failures in the 2026-09-03 run,
# every one of them reading "waiting for ... By.tagName: h1" and saying nothing about the
# real cause.
#
# Where a REAL account already holds the role, point at that instead. Checked against the
# database on 2026-09-04:
#   head_of_department  18 active holders
#   manager             41 active holders
#   dept_poc            98 active holders
#   cc_initiator        12 active holders
hodEmail = v_mertia@awnic.com
managerEmail = c_chiong@awnic.com

# STILL NO HOLDER ANYWHERE - checked 2026-09-04, zero active users hold cc_supervisor,
# complaint_handler or compliance_officer. These stay pointed at the placeholder accounts
# so that the moment somebody is granted one of these roles (either the placeholder or a
# real member of staff) the tests start running again. Until then their tests SKIP with
# BaseTest.requireTicketAccess's explanation rather than failing on a timeout.
# NO ACCOUNT HOLDS `cc_supervisor` after the clean - see adminEmail above.
supervisorEmail = supervisor@awnic.ae
# NO ACCOUNT HOLDS `complaint_handler` after the clean.
complaintHandlerEmail = complaints.officer@awnic.ae
# NO ACCOUNT HOLDS `compliance_officer` after the clean.
complianceEmail = compliance@awnic.ae

# THE DEPT POC IS A REAL AWNIC PERSON HERE, NOT A MADE-UP TEST ADDRESS.
#
# This used to point at dept.poc@awnic.ae and skip every own-department test, on the
# belief that no Dept POC account existed here. It does - it simply does not follow the
# "<role>@awnic.ae" naming the other seven test accounts use, because the Dept POCs on
# this environment are the real staff from AWNIC's escalation matrix (@awnic.com).
#
# Confirmed against the database on 2026-09-04:
#   a_shalaby@awnic.com   Ahmed Mohamed Shalaby   role dept_poc   dept "Medical Operations"
#   active, and his department currently holds 4 enquiries to be scoped against.
#
# Pick by ROLE, never by the shape of the address. If this person leaves, any active user
# holding dept_poc will do - prefer one whose department actually has tickets, or the
# scoping test has nothing to prove.
deptPocEmail = a_shalaby@awnic.com

unknownEmail = not.a.real.user@awnic.ae


# ---------------------------------------------------------------------------
# How the suite behaves on a shared environment
# ---------------------------------------------------------------------------

# true  = a test whose account does not exist here SKIPS, with an explanation.
# false = it FAILS (which is what you want on your own laptop, where every
#         account is seeded and a missing one is a real problem).
missingAccountsAreSkipped = true

# The three tests that create a real ticket. Off by default here so a routine run
# does not add rows to an environment other people are looking at.
writeTestsEnabled = false


# ---------------------------------------------------------------------------
# Seeded data
#
# Nothing on a shared environment can be assumed, so these are only used by tests
# that already check whether the data is there first.
# ---------------------------------------------------------------------------

# Must match deptPocEmail's OWN department, because that is what
# view_tickets_own_department compares the ticket against. "Medical Claims" here was the
# local seed's answer and is wrong for this environment - a_shalaby sits on Medical
# Operations, and a mismatch makes the scoping test assert against a department its
# account cannot see.
# a_shalaby@awnic.com's department - the dept_poc scope tests compare against it.
deptPocDepartment = Medical Operations
complaintHandlerTicketTail = 0001
